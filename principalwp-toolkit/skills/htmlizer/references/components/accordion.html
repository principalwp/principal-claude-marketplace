<!-- Copy-me accordion. base.css classes: .accordion (list wrapper), .accordion-item (each <details>), .accordion-trigger (the <summary>), .accordion-panel (revealed body). -->
<div class="accordion">
  <details class="accordion-item">
    <summary class="accordion-trigger">Summary label</summary>
    <div class="accordion-panel">
      <p>Panel content — prose, a <code>dl</code>, a list, whatever the section needs.</p>
    </div>
  </details>
  <details class="accordion-item">
    <summary class="accordion-trigger">Another item</summary>
    <div class="accordion-panel">
      <p>Second panel content.</p>
    </div>
  </details>
</div>
