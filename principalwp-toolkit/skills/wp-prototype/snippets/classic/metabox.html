<!-- Postbox / metabox (paste inside .wrap). The runtime toggles .closed when
     the header or arrow is clicked. Wrap several in .metabox-holder; add
     .postbox-container + .columns-2 layouts for edit-screen style columns. -->
<div class="metabox-holder">
	<div class="postbox">
		<div class="postbox-header">
			<h2 class="hndle">Box title</h2>
			<div class="handle-actions">
				<button type="button" class="handlediv" aria-expanded="true"><span class="screen-reader-text">Toggle panel</span><span class="toggle-indicator" aria-hidden="true"></span></button>
			</div>
		</div>
		<div class="inside">
			<p>Metabox content.</p>
		</div>
	</div>
</div>

<!-- Simple card (used on many core admin pages) -->
<div class="card">
	<h2 class="title">Card title</h2>
	<p>Card content — max-width constrained, good for explanatory sections.</p>
</div>
