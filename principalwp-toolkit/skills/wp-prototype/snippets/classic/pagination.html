<!-- List-table pagination (paste inside .tablenav, after the bulkactions div). -->
<div class="tablenav-pages">
	<span class="displaying-num">128 items</span>
	<span class="pagination-links">
		<span class="tablenav-pages-navspan button disabled" aria-hidden="true">«</span>
		<span class="tablenav-pages-navspan button disabled" aria-hidden="true">‹</span>
		<span class="paging-input">
			<label for="current-page-selector" class="screen-reader-text">Current Page</label>
			<input class="current-page" id="current-page-selector" type="text" name="paged" value="1" size="2">
			<span class="tablenav-paging-text"> of <span class="total-pages">7</span></span>
		</span>
		<a class="next-page button" href="#"><span aria-hidden="true">›</span></a>
		<a class="last-page button" href="#"><span aria-hidden="true">»</span></a>
	</span>
</div>
