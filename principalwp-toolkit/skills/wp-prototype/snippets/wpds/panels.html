<!-- Inspector panels (paste inside .interface-interface-skeleton__sidebar or any
     .components-panel). The runtime toggles .is-opened on title click. -->
<div class="components-panel">
	<div class="components-panel__body is-opened">
		<button class="components-panel__body-title">Open panel</button>
		<div class="components-panel__body-content">
			<!-- controls go here -->
		</div>
	</div>
	<div class="components-panel__body">
		<button class="components-panel__body-title">Closed panel</button>
		<div class="components-panel__body-content">
			<!-- hidden until opened -->
		</div>
	</div>
</div>

<!-- Two controls side by side in one row -->
<div class="components-panel__row">
	<span>Row label</span>
	<button class="components-button is-tertiary">Action</button>
</div>
