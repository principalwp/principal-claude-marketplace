<!-- WPDS tab panel (sidebar Settings/Styles pattern). The runtime wires
     data-tab / data-tab-panel switching. -->
<div data-tab-group>
	<div class="components-tab-panel__tabs">
		<button class="components-tab-panel__tabs-item is-active" data-tab="one">First</button>
		<button class="components-tab-panel__tabs-item" data-tab="two">Second</button>
	</div>
	<div data-tab-panel="one">
		<!-- first tab content -->
	</div>
	<div data-tab-panel="two" style="display: none">
		<!-- second tab content -->
	</div>
</div>
